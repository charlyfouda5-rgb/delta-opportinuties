<style>
:root{--n:#101a68;--t:#0fb9a3;--g:#f3f5fa;--b:#d9deea;--tx:#1a2038;--mu:#5d6580}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;color:var(--tx);background:var(--g)}
header{background:var(--n);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}header b{font-size:18px;letter-spacing:.5px}header b span{color:var(--t)}header .sp{flex:1}
main{max-width:980px;margin:0 auto;padding:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.tabs button{background:#fff;border:1px solid var(--b);border-radius:20px;padding:7px 14px;cursor:pointer}.tabs .on{background:var(--n);color:#fff;border-color:var(--n)}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:14px;margin:0 0 10px}.card h3{margin:6px 0 4px}.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;background:#e8ebf7;border-radius:10px;padding:2px 9px;font-size:12px;margin:0 4px 4px 0}.tag.ok{background:#d6f5ef;color:#07665a}.tag.warn{background:#fff0cf;color:#7a5200}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;font:inherit;margin:4px 0 8px;background:#fff}textarea{min-height:80px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 10px}
button.p,button.s,button.d{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit}button.p{background:var(--t);color:#04332d;font-weight:600}button.s{background:#e8ebf7;color:var(--n)}button.d{background:#fde5e5;color:#a11}
.err{color:#b00020;margin:6px 0}.ok2{color:#07665a}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}.modal>div{background:#fff;border-radius:14px;padding:18px;max-width:720px;width:100%}.gap{padding:6px 0;border-bottom:1px solid var(--b)}.auth{max-width:420px;margin:20px auto}.slogan{color:#b9c0ee;font-size:12px;width:100%}
body.lg{background:linear-gradient(160deg,#0b7fab 0%,#1f5fae 48%,#5b3fc4 100%) fixed;min-height:100vh;color:#fff}
.home{max-width:560px;margin:0 auto;padding:12px 14px 40px;text-align:center}.home h1{font-size:26px;margin:8px 0}.lead{font-size:16px}
.lb{display:flex;justify-content:flex-end;gap:8px;margin:6px 0 10px}.lb button{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.85);border-radius:16px;padding:8px 14px;font:700 16px system-ui;cursor:pointer}.lb .on{background:rgba(255,255,255,.22)}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;color:#0f2a3d;border:0;border-radius:99px;padding:8px 14px;font:700 14px system-ui;cursor:pointer}
.quit{background:#b91c1c;color:#fff;border:0;border-radius:10px;padding:12px 22px;font:700 17px system-ui;cursor:pointer;margin:10px 0}
.rc{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:24px;padding:22px 16px;margin:14px 0;cursor:pointer}.rc .ic{font-size:44px}.rc .tt{font-size:21px;font-weight:700;margin:6px 0}.rc .ds{opacity:.85}
.modal>div{color:var(--tx)}

button{font-family:inherit;transition:transform .12s,box-shadow .2s,filter .2s,background .2s,border-color .2s}

const row=(k,x)=>x?'<p><b>'+k+" :</b> "+esc(x)+"</p>":"";
const m=document.createElement("div");m.className="modal";m.onclick=e=>{if(e.target==m)m.remove()};
m.innerHTML='<div><span class="tag">'+TY[o.type]+"</span>"+(o.verified?'<span class="tag ok">Organisation vérifiée par DELTA</span>':'<span class="tag warn">Organisation non vérifiée par DELTA</span>')+"<h2>"+esc(o.title)+'</h2><div class="mu">'+esc(o.org_name)+"</div><p>"+esc(o.description).replace(/\n/g,"<br>")+"</p>"+row("Lieu",[o.city,o.country].filter(Boolean).join(", "))+row("Modalité",MO[o.mode])+row("Domaine",o.domain)+row("Niveau demandé",o.level)+row("Conditions d’éligibilité",o.conditions)+row("Documents demandés",o.docs)+row("Rémunération / financement",o.pay)+row("Date limite",o.deadline)+(o.link?'<p><a href="'+esc(o.link)+'" target="_blank" rel="noopener noreferrer">Lien officiel / procédure de candidature</a></p>':"")+
(sk.length?"<h3>Compétences demandées</h3>"+gaps.map(g=>'<div class="gap">'+(U.role=="candidate"?(g.ok?"✅ ":g.l?"🟡 ":"❌ "):"• ")+"<b>"+esc(g.s.n)+"</b> — niveau requis : "+LV[g.s.l]+(U.role=="candidate"?(g.ok?" (vous l’avez)":g.l?" (votre niveau : "+LV[g.l]+")":" (absente de votre profil)")+(g.ok?"":' <button class="s" onclick="this.closest(\'.modal\').remove();F={type:\'formation\',text:\''+esc(g.s.n).replace(/'/g,"")+'\'};go(\'search\')">Chercher une formation</button>'):"")+"</div>").join("")+(U.role=="candidate"?'<p class="mu">Le niveau de chaque compétence est celui que vous avez déclaré dans votre profil.</p>':""):"")+'<p><button class="s" onclick="this.closest(\'.modal\').remove()">Fermer</button></p></div>';document.body.appendChild(m)}
function vProfile(){return '<div class="card"><h3>Mes compétences</h3><p class="mu">Déclarez uniquement ce que vous maîtrisez réellement : elles servent à comparer votre profil aux exigences des offres.</p>'+(items.length?items.map((s,i)=>'<div class="gap"><b>'+esc(s.name)+"</b> — "+LV[s.level]+' <button class="d" onclick="rmSk('+i+')">Retirer</button></div>').join(""):'<div class="mu">Aucune compétence ajoutée.</div>')+'<div class="row" style="margin-top:10px"><input id="sn" placeholder="Compétence (ex. Excel)"><select id="sl">'+[1,2,3,4].map(i=>'<option value="'+i+'">'+LV[i]+"</option>").join("")+'</select></div><button class="p" onclick="addSk()">Ajouter</button></div>'}
function saveSk(){return api("setSkills",{items})}
function addSk(){const n=v("sn");if(!n)return;items=items.filter(s=>s.name.toLowerCase()!=n.toLowerCase()).concat([{name:n,level:+v("sl")}]);run(saveSk)}
function rmSk(i){items.splice(i,1);run(saveSk)}
/* ---- organisation ---- */
function vMine(){return(U.status!="active"?'<div class="card"><span class="tag warn">En attente de validation</span> Votre organisation doit être validée par DELTA avant de publier.</div>':"")+(my.length?my.map(o=>card(o).replace('<button class="p"','<button class="s" onclick="editOpp('+o.id+')">Modifier</button> <button class="d" onclick="delOpp('+o.id+')">Supprimer</button> <button class="p"')).join(""):'<div class="card mu">Vous n’avez encore publié aucune annonce.</div>')}
function editOpp(id){edit=my.find(x=>x.id==id);tab="form";render()}
function delOpp(id){if(confirm("Supprimer cette annonce ?"))run(async()=>{await api("delOpp",{id});await load()})}
function vForm(){const o=edit||{},L=(l,h)=>"<label>"+l+"</label>"+h;return '<div class="card"><h3>'+(edit?"Modifier":"Publier")+' une opportunité</h3>'+L("Type","<select id='fty'>"+opts(TY,o.type)+"</select>")+L("Titre",'<input id="ftl" value="'+esc(o.title)+'">')+L("Description","<textarea id='fds'>"+esc(o.description)+"</textarea>")+'<div class="row"><div>'+L("Pays",'<input id="fco" value="'+esc(o.country)+'">')+"</div><div>"+L("Ville",'<input id="fci" value="'+esc(o.city)+'">')+"</div><div>"+L("Domaine",'<input id="fdo" value="'+esc(o.domain)+'">')+"</div><div>"+L("Modalité","<select id='fmo'>"+opts(MO,o.mode,"—")+"</select>")+"</div><div>"+L("Niveau d’études / expérience",'<input id="flv" value="'+esc(o.level)+'">')+"</div><div>"+L("Date limite",'<input id="fdl" type="date" value="'+esc(o.deadline)+'">')+"</div></div>"+L("Compétences exigées (une par ligne, « Nom:niveau » de 1 à 4 — 1 débutant, 4 expert ; pour un diplôme : « Diplôme:Logistique »)","<textarea id='fsk' placeholder='Excel:3&#10;Anglais professionnel:3'>"+esc((o.skills||[]).map(s=>s.n+":"+s.l).join("\n"))+"</textarea>")+L("Conditions d’éligibilité","<textarea id='fcd'>"+esc(o.conditions)+"</textarea>")+L("Documents demandés",'<input id="fdc" value="'+esc(o.docs)+'">')+L("Rémunération ou financement",'<input id="fpy" value="'+esc(o.pay)+'">')+L("Lien officiel ou procédure de candidature",'<input id="flk" placeholder="https://…" value="'+esc(o.link)+'">')+'<button class="p" onclick="saveOpp()">'+(edit?"Enregistrer":"Publier")+"</button></div>"}
function saveOpp(){run(async()=>{const sk=v("fsk").split("\n").map(l=>{const p=l.split(":");return{n:p[0].trim(),l:parseInt(p[1])||1}}).filter(s=>s.n);await api("saveOpp",{id:edit&&edit.id,type:v("fty"),title:v("ftl"),description:v("fds"),country:v("fco"),city:v("fci"),domain:v("fdo"),mode:v("fmo"),level:v("flv"),deadline:v("fdl"),skills:sk,conditions:v("fcd"),docs:v("fdc"),pay:v("fpy"),link:v("flk")});edit=null;tab="mine";msg="Annonce enregistrée.";await load()})}
/* ---- super administrateur ---- */
function vRequests(){return items.length?items.map(r=>`<div class="card"><div class="row"><div><img src="${r.selfie_data}" alt="Selfie de ${esc(r.name)}" style="width:150px;height:150px;object-fit:cover;border-radius:12px"><p class="mu">Demande n° ${r.id} · ${new Date(r.created_at).toLocaleString()}</p></div><div><h3>${esc(r.name)}</h3><span class="tag">${r.role=="org"?"Organisation / entreprise":"Candidat"}</span><p><b>Téléphone :</b> ${esc(r.phone)}</p><p><b>Paiement :</b> ${esc(r.payment_method)} · ${esc(r.payment_phone)}</p><p><b>Montant :</b> ${r.payment_amount} FCFA</p><span class="tag warn">Paiement à vérifier manuellement</span></div></div><p class="mu">Avant d’accepter, vérifiez le transfert de 500 FCFA dans le compte marchand Orange Money / MTN Money configuré.</p><button class="p" onclick="decideAccount(${r.id},'accept')">Confirmer le paiement et accepter</button> <button class="d" onclick="decideAccount(${r.id},'reject')">Refuser la demande</button></div>`).join(""):'<div class="card mu">Aucune demande de création de compte en attente.</div>'}
function decideAccount(id,decision){const message=decision=="reject"?prompt("Motif du refus (facultatif) :")||"Demande refusée par le super administrateur.":(confirm("Confirmez-vous avoir vérifié le transfert réel de 500 FCFA et vouloir accepter cette demande ?")?"Paiement contrôlé et demande acceptée.":null);if(message===null)return;run(async()=>{await api("decideAccountRequest",{id,decision,message});msg=decision=="accept"?"Paiement vérifié et compte activé.":"Demande refusée. Le demandeur pourra recommencer la procédure.";await load()})}
function vUsers(){return items.map(u=>'<div class="card"><b>'+esc(u.name)+'</b> <span class="tag">'+RL[u.role]+'</span><span class="tag '+(u.status=="active"?"ok":"warn")+'">'+({active:"Actif",pending:"En attente",suspended:"Suspendu"})[u.status]+"</span>"+(u.verified&&u.role=="org"?'<span class="tag ok">Vérifiée</span>':"")+'<div class="mu">'+esc(u.phone||u.email)+(u.org_name?" · "+esc(u.org_name):"")+(u.country?" · "+esc(u.country):"")+"</div>"+(u.role=="super"?"":(u.status=="pending"?'<button class="p" onclick="uSet('+u.id+',\'validate\')">Autoriser la création du compte</button> ':"")+(u.status=="suspended"?'<button class="s" onclick="uSet('+u.id+',\'restore\')">Réactiver</button>':'<button class="d" onclick="uSet('+u.id+',\'suspend\')">Suspendre</button>'))+"</div>").join("")}
function uSet(id,action){run(async()=>{await api("userSet",{id,action});await load()})}
function vOpps(){return items.length?items.map(o=>card(o).replace('<button class="p"','<button class="s" onclick="oSt('+o.id+",'"+(o.status=="hidden"?"published":"hidden")+'\')">'+(o.status=="hidden"?"Republier":"Masquer")+'</button> <button class="d" onclick="delOpp('+o.id+')">Supprimer</button> <button class="p"')).join(""):'<div class="card mu">Aucune annonce.</div>'}
function oSt(id,status){run(async()=>{await api("oppStatus",{id,status});await load()})}
function vStats(){const n=(a,k)=>(a.find(x=>x.role==k||x.status==k)||{n:0}).n;return '<div class="card"><h3>Chiffres de la plateforme</h3>Candidats : <b>'+n(items.users,"candidate")+"</b><br>Organisations : <b>"+n(items.users,"org")+"</b><br>Annonces publiées : <b>"+n(items.opps,"published")+"</b><br>Annonces masquées : <b>"+n(items.opps,"hidden")+"</b></div>"}
applyLang();ping();
</script>
