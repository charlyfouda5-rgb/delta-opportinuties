const bars = o => { const e = Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 8), m = Math.max(1, ...e.map(x => x[1])); return e.map(([k, n]) => `<div class="bar"><span>${esc(S.TY[k] || S.RN[k] || k)}</span><i style="width:${Math.round(100 * n / m)}%"></i><b>${n}</b></div>`).join(''); };
const PAL = ['#1f5fae', '#0fb9a3', '#f0a500', '#5b3fc4', '#d62839', '#0b7fab', '#7a8cff', '#8ac926'];
const lbl = x => Array.isArray(x) ? x[st.lang == 'en' ? 1 : 0] : x, sh = (s, n) => String(s).length > n ? String(s).slice(0, n - 1) + '…' : String(s);
const dk = k => { k = lbl(k); return S.TY[k] || S.RN[k] || S.MO[k] || (PL[k]) || (S.ST.includes(k) ? stl(k) : EN.SEC[k] ? sec(k) : k); };
const none = () => `<p class="mu">${L('Pas encore de données pour cet indicateur.', 'No data yet for this indicator.')}</p>`;
const PL = { free: 'Gratuit', pro: 'Pro', premium: 'Premium' };
const CH = {
  gauges(c) { return `<div class="gg">${c.data.map(x => `<div>${CH.gauge({ pct: x.pct })}<small>${esc(lbl(x.k))}</small></div>`).join('')}</div>`; },
  vbars(c) { const d = c.data; if (!d.length || d.every(x => !x.v)) return none(); const m = Math.max(1, ...d.map(x => x.v)), W = 340, H = 170, sl = (W - 20) / d.length, bw = Math.min(44, sl - 8);
    return `<svg viewBox="0 0 ${W} ${H}" class="ch" role="img">` + d.map((x, i) => { const h = Math.round((H - 54) * x.v / m), xx = 10 + i * sl + (sl - bw) / 2, col = c.mono ? PAL[0] : PAL[i % 8]; return `<rect x="${xx}" y="${H - 30 - h}" width="${bw}" height="${h}" rx="4" fill="${col}"/><text x="${xx + bw / 2}" y="${H - 34 - h}" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor">${x.v}</text><text x="${xx + bw / 2}" y="${H - 14}" text-anchor="middle" font-size="9" fill="#5d6580">${esc(sh(dk(x.k), 9))}</text>`; }).join('') + '</svg>'; },
  hbars(c) { const d = c.data; if (!d.length || d.every(x => !x.v)) return none(); const m = Math.max(1, ...d.map(x => x.v)); return d.map((x, i) => `<div class="bar"><span title="${esc(dk(x.k))}">${esc(sh(dk(x.k), 22))}</span><i style="width:${Math.max(2, Math.round(100 * x.v / m) * .55)}%;background:${PAL[i % 8]}"></i><b>${x.v.toLocaleString('fr-FR')}${c.suffix || ''}</b></div>`).join(''); },
  line(c) { const n = c.labels.length; if (n < 1 || c.series.every(s => s.v.every(x => !x))) return none(); const W = 340, H = 170, Lm = 30, B = 24, mx = Math.max(1, ...c.series.flatMap(s => s.v)), X = i => Lm + i * (W - Lm - 8) / Math.max(1, n - 1), Y = v => H - B - (H - B - 12) * v / mx;
    let s = [0, 1, 2, 3].map(g => { const v = Math.round(mx * g / 3); return `<line x1="${Lm}" x2="${W - 8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3e7f2"/><text x="${Lm - 4}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="#5d6580">${v}</text>`; }).join('');
    c.series.forEach((se, k) => { const pts = se.v.map((v, i) => X(i) + ',' + Y(v)).join(' '); if (k == 0 && n > 1) s += `<polygon points="${X(0)},${H - B} ${pts} ${X(n - 1)},${H - B}" fill="${PAL[0]}" opacity=".12"/>`; s += `<polyline points="${pts}" fill="none" stroke="${PAL[k % 8]}" stroke-width="2.2" stroke-linejoin="round"/>` + (n < 12 ? se.v.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${PAL[k % 8]}"/>`).join('') : ''); });
    [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) == i).forEach(i => s += `<text x="${X(i)}" y="${H - 8}" text-anchor="${i == n - 1 && n > 1 ? 'end' : i == 0 && n > 1 ? 'start' : 'middle'}" font-size="9" fill="#5d6580">${esc(c.labels[i].slice(5))}</text>`);
    return `<svg viewBox="0 0 ${W} ${H}" class="ch" role="img">${s}</svg><div class="lg">${c.series.map((se, k) => `<span><i style="background:${PAL[k % 8]}"></i>${esc(lbl(se.n))}</span>`).join('')}</div>`; },
  donut(c) { const d = c.data.filter(x => x.v > 0), t = d.reduce((s, x) => s + x.v, 0); if (!t) return none(); let off = 25;
    return `<svg viewBox="0 0 42 42" class="ch dn" role="img"><circle cx="21" cy="21" r="15.915" fill="none" stroke="#eef0f7" stroke-width="6"/>${d.map((x, i) => { const p = 100 * x.v / t, e = `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${PAL[i % 8]}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`; off -= p; return e; }).join('')}<text x="21" y="22.5" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor">${t}</text></svg><div class="lg">${d.map((x, i) => `<span><i style="background:${PAL[i % 8]}"></i>${esc(dk(x.k))} · ${x.v} (${Math.round(100 * x.v / t)}%)</span>`).join('')}</div>`; },
  gauge(c) { const p = Math.max(0, Math.min(100, c.pct)); return `<svg viewBox="0 0 42 42" class="ch dn" role="img"><circle cx="21" cy="21" r="15.915" fill="none" stroke="#eef0f7" stroke-width="5"/><circle cx="21" cy="21" r="15.915" fill="none" stroke="${p < 40 ? PAL[4] : p < 75 ? PAL[2] : PAL[1]}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="25"/><text x="21" y="23.5" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor">${p}%</text></svg>`; },
  funnel(c) { const d = c.data; if (d.every(x => !x.v)) return none(); const m = Math.max(1, ...d.map(x => x.v)); return d.map((x, i) => `<div class="fn" style="width:${Math.max(24, Math.round(100 * x.v / m))}%;background:${PAL[i % 8]}">${esc(dk(x.k))} · ${x.v}</div>`).join(''); },

  const target = id => S.users(sup()).find(x => x.id == id);
  Object.assign(AC, {
    aflt() { st.af = { q: v('afq'), s: v('afs') }; },
    arem(id) { const x = target(id), a = aboOf(x), d = dif(a.end); a.rem = (a.rem || []).concat({ date: td(), txt: msg(d), read: false }); sv(); st.msg = L('Rappel envoyé à ', 'Reminder sent to ') + x.name + '.'; },
    abulk() { let n = 0; subs(sup()).filter(r => r.d <= 7).forEach(r => { r.a.rem = (r.a.rem || []).concat({ date: td(), txt: msg(r.d), read: false }); n++; }); sv(); st.msg = n + L(' rappel(s) envoyé(s).', ' reminder(s) sent.'); },
    arn(a) { const [id, n] = a.split('|'); renew(target(id), +n, L('super administrateur', 'super administrator')); st.msg = L('Abonnement prolongé.', 'Subscription extended.'); },
    aset(id) { const d = v('ad_' + id); if (!/^\d{4}-\d\d-\d\d$/.test(d)) throw new Error(L('Choisissez une date.', 'Pick a date.')); const a = aboOf(target(id)); a.end = d; a.sim = false; a.hist = (a.hist || []).concat({ date: td(), txt: L('Date fixée → ', 'Date set → ') + d }); sv(); st.msg = L('Date enregistrée.', 'Date saved.'); },
    acsv() { const r = subs(sup()).sort((p, q) => p.d - q.d), t = 'nom;role;fin;jours;etat\n' + r.map(x => [x.x.name, x.x.role, x.a.end, x.d, x.s[0]].join(';')).join('\n'), b = new Blob([t], { type: 'text/csv' }), l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = 'echeances-abonnements.csv'; l.click(); },
    aself() { const u = U(); renew(u, 30, L('renouvellement simulé', 'simulated renewal')); st.msg = L('Abonnement prolongé de 30 jours (simulation, aucun paiement).', 'Extended by 30 days (simulated, no payment).'); },
    aread() { (aboOf(U()).rem || []).forEach(x => x.read = true); sv(); }
  });
  const css = document.createElement('style'); css.textContent = '.pb{height:8px;background:#eef0f7;border-radius:6px;margin:6px 0}.pb i{display:block;height:8px;border-radius:6px;background:linear-gradient(90deg,#1fdcc0,#0a9a86)}'; document.head.appendChild(css);
  render();
})();
