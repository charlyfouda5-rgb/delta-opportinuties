<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a68"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="assets/favicon-32.png"><link rel="apple-touch-icon" href="assets/icon-180.png"><title>DELTA OPPORTUNITIES — DEMO</title>
<style>
:root{--n:#101a68;--t:#0fb9a3;--g:#f3f5fa;--b:#d9deea;--tx:#1a2038;--mu:#5d6580}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;color:var(--tx);background:var(--g)}

button{font:inherit;cursor:pointer}button.p,button.s,button.d{border:0;border-radius:10px;padding:9px 14px;margin:2px 0}button.p{background:linear-gradient(135deg,#1fdcc0,#0a9a86);color:#fff;font-weight:700}button.s{background:#fff;color:var(--n);border:1.5px solid #cfd6ee;font-weight:600}button.d{background:#d62839;color:#fff;font-weight:600}
.err{color:#b00020;background:#fde5e5;border-radius:8px;padding:8px;margin:6px 0}.okm{color:#07665a;background:#d6f5ef;border-radius:8px;padding:8px;margin:6px 0}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px;z-index:20}.modal>div{background:#fff;border-radius:14px;padding:18px;max-width:700px;width:100%;position:relative}.xx{position:absolute;right:10px;top:10px}
.gap{padding:7px 0;border-bottom:1px solid var(--b)}.rd{display:block;padding:4px 0}.lk{color:var(--n);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}.kpi{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:26px;color:var(--n)}.kpi span{font-size:12px;color:var(--mu)}

html{background:#3a4fb8}body:has(.home){background:linear-gradient(160deg,#0b7fab,#1f5fae 48%,#5b3fc4);min-height:100vh;color:#fff}.home{max-width:560px;margin:0 auto;padding:10px 14px 40px;text-align:center}.home .card,.home .modal>div{color:var(--tx);text-align:left}
.logo{width:min(55vw,210px);border-radius:50%;box-shadow:0 0 36px #f7bf1d99;margin:10px 0}.logo.sm2{width:110px}.lead{font-size:16px}.lb{display:flex;justify-content:flex-end;gap:8px}.lb button{background:#ffffff1f;color:#fff;border:2px solid #ffffffcc;border-radius:14px;padding:5px 12px;font-weight:700}.lb .on{background:#ffffff59}header .lb button{padding:3px 8px;font-size:13px}

.rc{background:#ffffff24;border:1px solid #ffffff52;border-radius:18px;padding:16px;margin:10px 0;cursor:pointer}.rc b{font-size:17px}.rc:hover{background:#ffffff3a}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:10px}.cg .card{margin:0;overflow:hidden}.ch{width:100%;height:auto;display:block;color:var(--tx)}.ch.dn{max-width:190px;margin:0 auto}.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

header select.spc{width:auto;margin:0;padding:6px 8px;background:#ffffff26;color:#fff;border:1px solid #ffffff66;font-weight:600}header select.spc option{color:#1a2038}
.ic{vertical-align:-3px;flex:none}.tabs button{display:inline-flex;align-items:center;gap:6px}header button.s{display:inline-flex;align-items:center;gap:6px;padding:7px 11px}.sico{display:inline-flex;width:30px;height:30px;border-radius:9px;background:#ffffff26;align-items:center;justify-content:center}
.ft{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.ft span{display:inline-flex;align-items:center;gap:6px;background:#ffffff26;border:1px solid #ffffff55;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

.acc{display:flex;align-items:center;gap:14px;text-align:left;background:#ffffff1f;border:1.5px solid #ffffff59;border-radius:22px;padding:16px;margin:14px 0;cursor:pointer;transition:transform .15s,background .15s;position:relative;overflow:hidden}.acc:hover,.acc:focus{background:#ffffff38;transform:translateY(-2px)}
.acc:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:linear-gradient(180deg,var(--c1),var(--c2))}.acc .ico{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;flex:none;box-shadow:0 8px 20px #0004}

.kpi{position:relative}.kpi .ki{display:inline-flex;width:34px;height:34px;border-radius:11px;align-items:center;justify-content:center;color:#fff;margin-bottom:4px;font-style:normal}.kpi .c0{background:linear-gradient(135deg,#1f5fae,#0b7fab)}.kpi .c1{background:linear-gradient(135deg,#0fb9a3,#0a9a86)}.kpi .c2{background:linear-gradient(135deg,#f0a500,#d9480f)}.kpi .c3{background:linear-gradient(135deg,#7a8cff,#5b3fc4)}.kpi .c4{background:linear-gradient(135deg,#ef476f,#d62839)}.kpi .c5{background:linear-gradient(135deg,#8ac926,#4f9d2d)}
.cg .card h3{display:flex;align-items:center;gap:7px}.cg .card h3 .ic{color:var(--t)}.tabs.sub button{display:inline-flex;align-items:center;gap:6px}
.acc{display:block!important;text-align:center!important;padding:26px 18px 20px!important;border-radius:34px!important;border:2px solid #ffffff4d!important;background:linear-gradient(180deg,#ffffff1f,#ffffff0d)!important}.acc:before{display:none!important}
.acc .emo{font-size:68px;line-height:1.1;margin-bottom:10px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.acc b{font-size:26px;display:block;margin-bottom:6px}.acc p{font-size:16px!important;line-height:1.45!important;margin:0 4px 12px!important}.acc .chips{justify-content:center}.acc .chips span{font-size:13px;padding:4px 10px}.acc .em{justify-content:center;font-size:13px;opacity:.8}
.sico{font-size:18px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pw{position:relative}.pw .eye{position:absolute;right:6px;top:6px;background:none;border:0;font-size:18px;padding:4px;cursor:pointer}.pw input{padding-right:40px}
.bsel{display:block;text-align:center;cursor:pointer;border-radius:10px;padding:11px;color:#fff;background:linear-gradient(135deg,#1f5fae,#0b7fab);font-weight:700;margin:8px 0}.card.dk label:not(.bsel){display:block;font-weight:600;font-size:13px;color:var(--mu);margin-top:4px}
